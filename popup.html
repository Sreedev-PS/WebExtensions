<!DOCTYPE html>
<html>
  <head>
    <title>Latest Naukri Jobs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h2>Latest Naukri Jobs</h2>

    <label>
      Max Pages
      <input id="maxPagesInput" type="number" value="100" min="1" max="20" />
    </label>

    <label>
      Keywords
      <input
        id="keywordInput"
        type="text"
        value="angular developer, frontend developer, ui developer, typescript developer, javascript developer"
      />
    </label>

    <button id="startBtn">Start Scan</button>
    <button id="stopBtn">Stop Scan</button>
    <button id="showBtn">Show Saved Jobs</button>
    <button id="downloadHtmlBtn">Download HTML</button>
    <button id="downloadCsvBtn">Download Excel CSV</button>
    <button id="clearBtn">Clear Saved Jobs</button>

    <p id="status">Ready</p>

    <div id="jobs"></div>

    <script src="popup.js"></script>
  </body>
</html>
