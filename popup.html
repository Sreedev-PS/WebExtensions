<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Naukri Auto-Updater</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      padding: 20px;
      background: white;
    }
    
    .header {
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 18px;
      color: #667eea;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      color: #666;
    }
    
    .status-box {
      padding: 12px;
      background: #f0f0f0;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
    }
    
    .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .current-headline {
      font-size: 13px;
      color: #333;
      font-weight: 500;
      word-wrap: break-word;
      max-height: 60px;
      overflow-y: auto;
    }
    
    .controls {
      margin-bottom: 15px;
    }
    
    .button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    
    .button-start {
      background: #667eea;
      color: white;
    }
    
    .button-start:hover {
      background: #5568d3;
    }
    
    .button-stop {
      background: #ff6b6b;
      color: white;
    }
    
    .button-stop:hover {
      background: #ee5a5a;
    }
    
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .headlines-section {
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    
    .headlines-section h3 {
      font-size: 13px;
      color: #333;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .headline-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
      font-family: inherit;
      resize: vertical;
    }
    
    .headline-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .headlines-list {
      max-height: 150px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 8px;
      background: #f9f9f9;
      border-radius: 4px;
    }
    
    .headline-item {
      padding: 8px;
      background: white;
      border: 1px solid #eee;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 12px;
      word-wrap: break-word;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .headline-text {
      flex: 1;
      margin-right: 8px;
    }
    
    .remove-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      flex-shrink: 0;
    }
    
    .remove-btn:hover {
      background: #ee5a5a;
    }
    
    .add-btn {
      width: 100%;
      padding: 8px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    
    .add-btn:hover {
      background: #5568d3;
    }
    
    .info {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Naukri Auto-Updater</h1>
      <p>Update resume headline every 10 seconds</p>
    </div>
    
    <div class="status-box">
      <div class="status">Status: <strong id="status">Stopped</strong></div>
      <div class="current-headline" id="currentHeadline">-</div>
    </div>
    
    <div class="controls">
      <button class="button button-start" id="startBtn">▶ Start Auto-Update</button>
      <button class="button button-stop" id="stopBtn" disabled>⏹ Stop Auto-Update</button>
    </div>
    
    <div class="headlines-section">
      <h3>Headlines to Rotate</h3>
      <textarea class="headline-input" id="headlineInput" placeholder="Enter a new headline..."></textarea>
      <button class="add-btn" id="addHeadlineBtn">+ Add Headline</button>
      
      <div class="headlines-list" id="headlinesList"></div>
    </div>
    
    <div class="info">
      ✓ Make sure you're on your Naukri profile page<br>
      ✓ Headlines rotate every 10 seconds<br>
      ✓ Close this popup to continue updates in background
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
